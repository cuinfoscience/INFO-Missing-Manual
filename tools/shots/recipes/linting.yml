# Screenshots for chapters/linting.qmd, taken from the local code-server fixture (VS Code in
# the browser, with the Ruff extension). Start it first with
# bash tools/shots/fixtures/code-server/start.sh (see its README); stop.sh afterwards.
chapter: linting
figures:
  - id: vscode-ruff-squiggles
    kind: capture
    section: "Editor integration: format on save"
    url: "http://localhost:8898/"
    window: [1024, 768]
    timeout: 180
    steps:
      - wait: {selector: '.explorer-folders-view .monaco-list-row[aria-label*="lint_demo.py"]'}
      - click: {selector: '.explorer-folders-view .monaco-list-row[aria-label*="lint_demo.py"]'}
      # Ruff's diagnostics arrive a moment after the file opens: three squiggles.
      - wait: {selector: '.view-overlays .squiggly-warning >> nth=2'}
      - settle: 2
      # Squiggles take no pointer events, so a hover step on them times out (and scrolls the
      # editor). Use VS Code's keyboard route instead: go to line 4, column 8 (`os`), then
      # Ctrl+K Ctrl+I shows the same hover a mouse would.
      - press: 'Control+G'
      - wait: {selector: '.quick-input-widget input'}
      - type: '4:8'
      - press: 'Enter'
      - settle: 1
      - press: 'Control+K'
      - press: 'Control+I'
      - wait: {selector: '.monaco-hover .hover-contents'}
      - settle: 1
    # The editor alone, from its tab bar through the last line: 580 px wide, so the text keeps
    # its on-screen size in the body column. The hover opens above line 4, over line 1-3.
    crop: {left: 300, top: 36, width: 580, height: 364}
    drifts: true
    notes: "Local fixture tools/shots/fixtures/code-server, project/lint_demo.py with the chapter's Ruff configuration in pyproject.toml."
