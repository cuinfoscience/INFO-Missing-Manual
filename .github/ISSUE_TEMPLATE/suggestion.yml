name: Suggestion
description: An improvement that would make the book better — including a chapter or topic it should cover
title: "Suggestion: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for something you would like to see: a clearer example, a
        diagram, an extra exercise, a reading, or a whole topic the book should
        cover and does not.

        If something actually **stopped you**, use
        [I'm stuck or confused](https://github.com/cuinfoscience/INFO-Missing-Manual/issues/new?template=im-stuck.yml)
        instead. If something is **wrong or broken**, use
        [Something is wrong](https://github.com/cuinfoscience/INFO-Missing-Manual/issues/new?template=something-is-wrong.yml).
        Those two get looked at first, so put it there if it fits.

  - type: dropdown
    id: chapter
    attributes:
      label: Which chapter?
      description: Start typing a word from the title to jump to it. For a new chapter, pick the Part it would belong to, or "The book as a whole."
      options:
        # BEGIN chapters (generated by scripts/sync_issue_chapters.py — do not edit by hand)
        - "Ch. 1 — Introduction"
        - "Ch. 2 — Asking Technical Questions"
        - "Ch. 3 — Technical Documentation"
        - "Ch. 4 — Common Text Formats"
        - "Ch. 5 — Reading Official Documentation"
        - "Ch. 6 — Debugging"
        - "Ch. 7 — Reading Python Tracebacks"
        - "Ch. 8 — Artifacts Have Politics"
        - "Ch. 9 — Operating System"
        - "Ch. 10 — Local File System"
        - "Ch. 11 — Command Line"
        - "Ch. 12 — Text Editors"
        - "Ch. 13 — Remote Computing"
        - "Ch. 14 — Package Management"
        - "Ch. 15 — Virtual Environments"
        - "Ch. 16 — Jupyter"
        - "Ch. 17 — Scripting"
        - "Ch. 18 — Regular Expressions"
        - "Ch. 19 — Code Style"
        - "Ch. 20 — Data File Formats"
        - "Ch. 21 — Tabular Data"
        - "Ch. 22 — pandas Basics"
        - "Ch. 23 — SQL Basics"
        - "Ch. 24 — HTTP and Web APIs"
        - "Ch. 25 — How to Read Scholarly Articles and Books"
        - "Ch. 26 — How to Write Scholarly Manuscripts"
        - "Ch. 27 — How to Write a Thesis"
        - "Ch. 28 — How to Present"
        - "Ch. 29 — How to Use LaTeX"
        - "Ch. 30 — Project Management"
        - "Ch. 31 — Version Control"
        - "Ch. 32 — Collaboration Mechanics"
        - "Ch. 33 — Automation"
        - "Ch. 34 — Environment Variables and Secrets"
        - "Ch. 35 — Using AI Tools"
        - "Ch. 36 — How Language Models Work"
        - "Ch. 37 — Working with AI Agent Frameworks"
        - "Ch. 38 — Evaluating and Auditing AI Outputs"
        - "Ch. 39 — Conclusion"
        - "Appendix — Glossary"
        - "Appendix — Disclosure: Use of AI in Authoring"
        # END chapters
        - "The book as a whole"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of suggestion?
      options:
        - "Add an example"
        - "Add or improve a figure, diagram, or screenshot"
        - "Add or strengthen an exercise"
        - "Add a reading or link"
        - "Rewrite or reorganize something for clarity"
        - "Propose a new chapter or topic"
        - "Something else"
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What would you add or change?
      description: |
        Be concrete — a specific suggestion is far easier to act on than a general
        one. For a new chapter or topic, say what it would cover and where in the
        book it belongs.
      placeholder: |
        Add a short section on profiling (%%timeit, cProfile) to the Jupyter
        chapter. The book teaches how to make code work but never how to tell
        which part is slow.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Who would this help, and how?
      description: One or two sentences.
      placeholder: "Anyone whose notebook takes minutes to run and does not know where to start looking."
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      description: Optional.
      options:
        - label: I glanced at the open issues and did not see this one already suggested.
          required: false
