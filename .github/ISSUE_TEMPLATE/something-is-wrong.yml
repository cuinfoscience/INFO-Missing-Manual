name: Something is wrong
description: A command that fails, a step that does not match your computer, a dead link, or a wrong fact
title: "Broken: "
labels: ["broken"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when something in the book **is wrong or does not work**.

        Software changes underneath a book like this: menus move, commands get
        renamed, links die. Noticing one of those is a real contribution, and you
        do not need to know how to fix it. You also do not need to be sure it is
        the book's fault — if you followed the steps and it did not work, tell us.

  - type: dropdown
    id: chapter
    attributes:
      label: Which chapter?
      description: Start typing a word from the title to jump to it.
      options:
        # BEGIN chapters (generated by scripts/sync_issue_chapters.py — do not edit by hand)
        - "Ch. 1 — Introduction"
        - "Ch. 2 — Asking Technical Questions"
        - "Ch. 3 — Technical Documentation"
        - "Ch. 4 — Common Text Formats"
        - "Ch. 5 — Reading Official Documentation"
        - "Ch. 6 — Debugging"
        - "Ch. 7 — Reading Python Tracebacks"
        - "Ch. 8 — Artifacts Have Politics"
        - "Ch. 9 — Operating System"
        - "Ch. 10 — Local File System"
        - "Ch. 11 — Command Line"
        - "Ch. 12 — Text Editors"
        - "Ch. 13 — Remote Computing"
        - "Ch. 14 — Package Management"
        - "Ch. 15 — Virtual Environments"
        - "Ch. 16 — Jupyter"
        - "Ch. 17 — Scripting"
        - "Ch. 18 — Regular Expressions"
        - "Ch. 19 — Code Style"
        - "Ch. 20 — Data File Formats"
        - "Ch. 21 — Tabular Data"
        - "Ch. 22 — pandas Basics"
        - "Ch. 23 — SQL Basics"
        - "Ch. 24 — HTTP and Web APIs"
        - "Ch. 25 — How to Read Scholarly Articles and Books"
        - "Ch. 26 — How to Write Scholarly Manuscripts"
        - "Ch. 27 — How to Write a Thesis"
        - "Ch. 28 — How to Present"
        - "Ch. 29 — How to Use LaTeX"
        - "Ch. 30 — Project Management"
        - "Ch. 31 — Version Control"
        - "Ch. 32 — Collaboration Mechanics"
        - "Ch. 33 — Automation"
        - "Ch. 34 — Environment Variables and Secrets"
        - "Ch. 35 — Using AI Tools"
        - "Ch. 36 — How Language Models Work"
        - "Ch. 37 — Working with AI Agent Frameworks"
        - "Ch. 38 — Evaluating and Auditing AI Outputs"
        - "Ch. 39 — Conclusion"
        - "Appendix — Glossary"
        - "Appendix — Disclosure: Use of AI in Authoring"
        # END chapters
        - "The website itself (sidebar, search, navigation)"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Which section or heading?
      description: Optional. Copy the nearest heading, or paste the page link, so we can find the spot quickly.
      placeholder: "Opening a terminal"
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - "A command or code does not run — I got an error"
        - "It ran, but the result is not what the book says"
        - "The steps do not match what I see on my computer"
        - "A link is dead or goes to the wrong place"
        - "A screenshot or figure does not match what I see"
        - "A fact, name, date, or citation looks incorrect"
        - "Something else"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did the book say would happen, and what happened instead?
      description: Two or three sentences is plenty.
      placeholder: |
        The book says pressing Ctrl+Alt+T opens a terminal. On my laptop it
        opened the accessibility settings instead.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Paste what you saw
      description: |
        The command you ran and the output or error message, copied as text
        rather than screenshotted if you can. Paste the whole error, including
        the last few lines — that is usually the part that matters.
        (Chapter 2, *Asking Technical Questions*, explains why this helps.)
      render: text
      placeholder: |
        $ python -m venv .venv
        python: command not found
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: What kind of computer are you on?
      description: Optional, but many steps in this book differ by operating system.
      options:
        - "macOS"
        - "Windows"
        - "Windows with WSL"
        - "Linux"
        - "Chromebook"
        - "This is not about my computer"
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Do you know the fix?
      description: Optional. If you worked out what is wrong, say so. If not, leave this blank — the report is still useful.
      placeholder: "On Ubuntu 24.04 the shortcut is Ctrl+Alt+T only if you have enabled it in Keyboard settings first."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      description: Optional. If you have time, a quick search helps us avoid duplicates — but do not let it stop you.
      options:
        - label: I glanced at the open issues and did not see this one already.
          required: false
