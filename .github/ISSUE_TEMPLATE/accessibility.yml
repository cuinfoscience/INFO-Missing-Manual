name: Accessibility problem
description: Something about the website is hard to use with a screen reader, keyboard, zoom, or because of color
title: "Accessibility: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the **website itself** gets in the way — not the ideas in
        the text, but reading or navigating them. An image with no description,
        text you cannot enlarge, a color you cannot distinguish, a control you
        cannot reach with the keyboard.

        These reports matter a great deal and are often invisible to the people
        who wrote the book. Please do not hold back on "small" ones.

  - type: dropdown
    id: chapter
    attributes:
      label: Where is it?
      description: Start typing a word from the title to jump to it.
      options:
        # BEGIN chapters (generated by scripts/sync_issue_chapters.py — do not edit by hand)
        - "Ch. 1 — Introduction"
        - "Ch. 2 — Asking Technical Questions"
        - "Ch. 3 — Technical Documentation"
        - "Ch. 4 — Common Text Formats"
        - "Ch. 5 — Reading Official Documentation"
        - "Ch. 6 — Debugging"
        - "Ch. 7 — Reading Python Tracebacks"
        - "Ch. 8 — Artifacts Have Politics"
        - "Ch. 9 — Operating System"
        - "Ch. 10 — Local File System"
        - "Ch. 11 — Command Line"
        - "Ch. 12 — Text Editors"
        - "Ch. 13 — Remote Computing"
        - "Ch. 14 — Package Management"
        - "Ch. 15 — Virtual Environments"
        - "Ch. 16 — Jupyter"
        - "Ch. 17 — Scripting"
        - "Ch. 18 — Regular Expressions"
        - "Ch. 19 — Code Style"
        - "Ch. 20 — Data File Formats"
        - "Ch. 21 — Tabular Data"
        - "Ch. 22 — pandas Basics"
        - "Ch. 23 — SQL Basics"
        - "Ch. 24 — HTTP and Web APIs"
        - "Ch. 25 — How to Read Scholarly Articles and Books"
        - "Ch. 26 — How to Write Scholarly Manuscripts"
        - "Ch. 27 — How to Write a Thesis"
        - "Ch. 28 — How to Present"
        - "Ch. 29 — How to Use LaTeX"
        - "Ch. 30 — Project Management"
        - "Ch. 31 — Version Control"
        - "Ch. 32 — Collaboration Mechanics"
        - "Ch. 33 — Automation"
        - "Ch. 34 — Environment Variables and Secrets"
        - "Ch. 35 — Using AI Tools"
        - "Ch. 36 — How Language Models Work"
        - "Ch. 37 — Working with AI Agent Frameworks"
        - "Ch. 38 — Evaluating and Auditing AI Outputs"
        - "Ch. 39 — Conclusion"
        - "Appendix — Glossary"
        - "Appendix — Disclosure: Use of AI in Authoring"
        # END chapters
        - "The whole website (sidebar, search, navigation, theme)"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - "Screen reader — something is unlabeled, unreadable, or read in the wrong order"
        - "Keyboard — I cannot reach or operate something without a mouse"
        - "Color or contrast — hard to see or tell apart"
        - "Text size or zoom — text is too small or the page breaks when I enlarge it"
        - "An image or figure has no useful description"
        - "Motion or animation is distracting or cannot be paused"
        - "Something else"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What were you trying to do, and what got in the way?
      placeholder: |
        Using VoiceOver, the terminal figure in the Command Line chapter is
        announced only as "image" — the numbered callouts are never read out.
    validations:
      required: true

  - type: input
    id: setup
    attributes:
      label: What are you using?
      description: Optional. Browser, device, and any assistive technology — for example "Safari on iPhone with VoiceOver" or "Firefox at 200% zoom."
      placeholder: "Chrome on Windows with NVDA"
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: What would make it work for you?
      description: Optional. Even a guess helps.
      placeholder: "A text description of what each numbered callout points to, below the figure."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      description: Optional.
      options:
        - label: I glanced at the open issues and did not see this one already.
          required: false
