name: I'm stuck or confused
description: The book did not tell you something you needed, or you have a question it does not answer
title: "Gap: "
labels: ["gap"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when nothing crashed, but you **could not keep going** — a step
        assumed something you did not know, an explanation lost you, or you have
        a question the book never gets to.

        You do not need to know the answer. Saying *where* you got stuck is the
        whole contribution. You are reading this material for the first time,
        which makes you the best person alive to spot a hole in it.

  - type: dropdown
    id: chapter
    attributes:
      label: Where were you?
      description: Start typing a word from the title to jump to it.
      options:
        # BEGIN chapters (generated by tools/issue-forms/sync_issue_chapters.py — do not edit by hand)
        - "Ch. 1 — Introduction"
        - "Ch. 2 — Asking Technical Questions"
        - "Ch. 3 — Technical Documentation"
        - "Ch. 4 — Common Text Formats"
        - "Ch. 5 — Reading Official Documentation"
        - "Ch. 6 — Debugging"
        - "Ch. 7 — Reading Python Tracebacks"
        - "Ch. 8 — Artifacts Have Politics"
        - "Ch. 9 — Operating System"
        - "Ch. 10 — Local File System"
        - "Ch. 11 — Command Line"
        - "Ch. 12 — Text Editors"
        - "Ch. 13 — Remote Computing"
        - "Ch. 14 — Package Management"
        - "Ch. 15 — Virtual Environments"
        - "Ch. 16 — Jupyter"
        - "Ch. 17 — Scripting"
        - "Ch. 18 — Regular Expressions"
        - "Ch. 19 — Code Style"
        - "Ch. 20 — Data File Formats"
        - "Ch. 21 — Tabular Data"
        - "Ch. 22 — pandas Basics"
        - "Ch. 23 — SQL Basics"
        - "Ch. 24 — HTTP and Web APIs"
        - "Ch. 25 — How to Read Scholarly Articles and Books"
        - "Ch. 26 — How to Write Scholarly Manuscripts"
        - "Ch. 27 — How to Write a Thesis"
        - "Ch. 28 — How to Present"
        - "Ch. 29 — How to Use LaTeX"
        - "Ch. 30 — Project Management"
        - "Ch. 31 — Version Control"
        - "Ch. 32 — Collaboration Mechanics"
        - "Ch. 33 — Automation"
        - "Ch. 34 — Environment Variables and Secrets"
        - "Ch. 35 — Using AI Tools"
        - "Ch. 36 — How Language Models Work"
        - "Ch. 37 — Working with AI Agent Frameworks"
        - "Ch. 38 — Evaluating and Auditing AI Outputs"
        - "Ch. 39 — Conclusion"
        - "Appendix — Glossary"
        - "Appendix — Disclosure: Use of AI in Authoring"
        # END chapters
        - "Between chapters — I did not know where to look"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Which section or heading?
      description: Optional. Copy the nearest heading, or paste the page link.
      placeholder: "Flavors: CommonMark, GFM, and friends"
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: What kind of stuck?
      options:
        - "Something was missing — I needed it and it was not there"
        - "Something was unclear — it was there, but I could not follow it"
        - "I have a question the book does not answer"
        - "Not sure / a mix"
    validations:
      required: true

  - type: textarea
    id: stuck
    attributes:
      label: Where did you get stuck, or what is your question?
      description: |
        What were you trying to do, and what stopped you? Quote the sentence you
        reread, or name the step you could not take. "This section is confusing"
        is hard to act on; "I did not know what PATH meant when it first
        appeared" is easy to fix.
      placeholder: |
        I was following the virtual environment steps. The book says to
        "activate" it, but I did not understand what activating changes or how
        I would know whether it worked.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      description: Optional. Searching, rereading, asking a classmate — anything. It tells us where the book's explanation ran out.
      placeholder: "I reread the section twice and searched 'activate venv' but the results assumed I already knew what a shell was."
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: What would have helped?
      description: Optional. You do not have to write the fix — just say what would have unstuck you. A sentence, a picture, an example, a definition.
      placeholder: "One sentence saying that activating just changes which python your terminal runs, and a way to check."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      description: Optional. A quick search helps us avoid duplicates — but do not let it stop you.
      options:
        - label: I glanced at the open issues and did not see this one already.
          required: false
