project:
  type: book
  output-dir: book
  resources:
    - graphics/**

book:
  title: "Missing Manual for Information Scientists"
  subtitle: "The hidden curriculum of computing technologies"
  author:
    - "Brian C. Keegan"
  date: today
  date-format: "MMMM YYYY"
  search: true
  repo-url: https://github.com/cuinfoscience/INFO-Missing-Manual
  repo-branch: main
  repo-actions: [edit, issue]
  sharing: [linkedin]
  sidebar:
    style: docked
    collapse-level: 2

  chapters:
    - index.qmd

    - part: "Part I — Practice of Technical Work"
      chapters:
        - chapters/questions.qmd
        - chapters/documentation.qmd
        - chapters/common-formats.qmd
        - chapters/reading-docs.qmd
        - chapters/debugging.qmd
        - chapters/tracebacks.qmd
        - chapters/artifacts-have-politics.qmd

    - part: "Part II — Computing Environment"
      chapters:
        - chapters/operating-system.qmd
        - chapters/file-system.qmd
        - chapters/terminal.qmd
        - chapters/text-editors.qmd
        - chapters/remote.qmd

    - part: "Part III — Python Management"
      chapters:
        - chapters/package-management.qmd
        - chapters/virtual-environments.qmd
        - chapters/jupyter.qmd
        - chapters/scripting.qmd
        - chapters/regex.qmd
        - chapters/linting.qmd

    - part: "Part IV — Working with Data"
      chapters:
        - chapters/data-file-formats.qmd
        - chapters/tabular-data.qmd
        - chapters/pandas-basics.qmd
        - chapters/sql-basics.qmd
        - chapters/http-apis.qmd

    - part: "Part V — Communication"
      chapters:
        - chapters/reading-scholarship.qmd
        - chapters/writing-manuscripts.qmd
        - chapters/writing-thesis.qmd
        - chapters/presenting.qmd
        - chapters/latex.qmd

    - part: "Part VI — Project Management"
      chapters:
        - chapters/project-management.qmd
        - chapters/version-control.qmd
        - chapters/collaboration.qmd
        - chapters/automation.qmd
        - chapters/secrets.qmd

    - part: "Part VII — Algorithmic Systems"
      chapters:
        - chapters/ai-llm.qmd
        - chapters/llm-internals.qmd
        - chapters/ai-agents.qmd
        - chapters/evaluating-ai.qmd

    - conclusion.qmd

  appendices:
    - chapters/appendix-glossary.qmd
    - chapters/appendix-ai-disclosure.qmd

# Books inherit most website options from `book:`, but Quarto 1.9 routes
# `llms-txt` through the website config specifically. Declaring a sibling
# `website:` block with only this key makes llms.txt / .llms.md generation work.
website:
  llms-txt: true

# The chapter-meme shortcode lives with its generator in tools/chapter-meme/
# rather than in an _extensions/ folder; this key loads it for every chapter.
shortcodes:
  - tools/chapter-meme/chapter-meme.lua

bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    code-block-bg: true
    reference-location: margin
    citation-location: margin
    fig-cap-location: margin
    link-external-icon: true
    link-external-newwindow: true